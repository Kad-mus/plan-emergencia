<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Emergencia Familiar</title>

<link rel="manifest" href="manifest.webmanifest">

<style id="app-css">
:root{--bg:#f4f5f7;--card:#fff;--ink:#1e2430;--mut:#667085;--line:#e3e6eb;--acc:#ea580c;--acc2:#fff1e8;--ok:#047857;--okb:#d1fae5;--warn:#92400e;--warnb:#fef3c7;--bad:#991b1b;--badb:#fee2e2;--blue:#1d4ed8;--blueb:#dbeafe;--dark:#141a24}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hdr{background:var(--dark);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hdr .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:20px}
.brand h1{font-size:19px;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;color:#9aa4b2;font-size:12.5px}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sos{background:#b91c1c;color:#fff;font-weight:700;border-radius:8px;padding:6px 10px;font-size:13px;letter-spacing:.3px}
.badge{font-size:12px;border-radius:999px;padding:4px 10px;background:#243042;color:#cbd5e1;white-space:nowrap}
.badge.ok{background:#064e3b;color:#a7f3d0}.badge.lo{background:#3b2f12;color:#fde68a}.badge.ro{background:#3f1d1d;color:#fecaca}
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 10px;cursor:pointer;white-space:nowrap;color:var(--mut);font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:650}
main.wrap{padding-top:18px}
h2{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#c7ccd4}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:#c2410c}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.x{border:0;background:none;color:var(--mut);padding:4px 6px}
.btn.x:hover{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid #cfd4dc;border-radius:8px;padding:7px 9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #fdba74;border-color:var(--acc)}
.tools input[type=search]{width:200px}
.tools select{width:auto}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}.tools input[type=search]{width:100%}.brand h1{font-size:17px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:22px;font-weight:700;margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--mut)}
.meter{height:7px;background:#eceef2;border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.meter i.w{background:#d97706}.meter i.b{background:#dc2626}
.tbl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f3f6;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:#4a5363;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid #eef0f3;vertical-align:middle}
tr:hover td{background:#fafbfc}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#eef0f3;font-weight:500;white-space:nowrap}
.st{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.w{background:var(--warnb);color:var(--warn)}.st.b{background:var(--badb);color:var(--bad)}.st.n{background:#eef0f3;color:var(--mut)}
.prio-Crítica{color:var(--bad);font-weight:650}.prio-Alta{color:#b45309;font-weight:600}.prio-Recomendada{color:var(--mut)}
.muted{color:var(--mut)}.small{font-size:12px}
.chk{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.qty{display:inline-flex;gap:4px;align-items:center}
.qty b{min-width:34px;text-align:right;display:inline-block}
.alerts{display:grid;gap:6px}
.al{padding:8px 12px;border-radius:8px;font-size:13px}
.al.b{background:var(--badb);color:var(--bad)}.al.w{background:var(--warnb);color:var(--warn)}.al.i{background:var(--blueb);color:var(--blue)}.al.ok{background:var(--okb);color:var(--ok)}
.field label{display:block;font-size:12px;font-weight:600;color:#3d4554;margin-bottom:4px}
.field .h{font-size:11.5px;color:var(--mut);margin-top:3px}
.sec{margin-top:22px}
.sec h3{font-size:15px;margin:0 0 10px}
.guides{columns:2 360px;column-gap:14px}
.guide{break-inside:avoid;margin-bottom:14px;border-top:4px solid var(--c,#64748b)}
.guide h4{margin:0 0 8px;font-size:15px;color:var(--c,#334155)}
.guide .body{font-size:13px;color:#384050}
.guide .body ul{margin:4px 0 6px;padding-left:18px}
.guide .body li{margin:3px 0}
.guide .body h5{margin:8px 0 3px;font-size:13px}
.guide .body p{margin:4px 0}
.gact{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .grid{gap:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.printopts label{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.printopts label small{display:block;color:var(--mut)}
.empty{padding:22px;text-align:center;color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv b{font-weight:600}
textarea{min-height:70px;resize:vertical}
.login{max-width:380px;margin:8vh auto;padding:24px}.login h2{margin-bottom:4px}.login .grid{gap:12px;margin-top:14px}.err{color:var(--bad);font-size:13px;min-height:18px}.who{font-size:12px;color:#9aa4b2}.btn.hd{background:#243042;border-color:#334155;color:#e2e8f0}
.foot-note{margin-top:28px;font-size:12px;color:var(--mut);text-align:center}
</style>
</head>

function defaultGuides(){
  return [
    {id:id(),title:'1. Potabilización de agua',color:'Azul',body:
'## Lejía\n- Usa solo lejía cuya etiqueta diga **"apta para la desinfección de agua de bebida"** (sin perfume ni aditivos).\n- **2 gotas por litro** de agua clara; **4 gotas** si está turbia o fría.\n- Agita y deja reposar **30 minutos** tapada. Debe notarse un ligero olor a cloro; si no, repite la dosis y espera 15 minutos más.\n## Ebullición\n- Hierve a borbotones **al menos 1 minuto** (3 minutos en altitud). Deja enfriar tapada en un recipiente limpio.\n## Filtrado previo\n- Si el agua está turbia, déjala reposar y fíltrala con un paño limpio o un filtro de café **antes** de desinfectar.\n- La lejía y la ebullición no eliminan contaminación química (combustibles, productos industriales): no consumas esa agua.'},
    {id:id(),title:'2. Almacenamiento y rotación del agua',color:'Cian',body:
'- Guarda las garrafas en un lugar **fresco, oscuro** y lejos de productos químicos, combustibles o pinturas.\n- Usa agua envasada y precintada; respeta su fecha y rótala por la más antigua (FIFO).\n- Si envasas agua del grifo: botellas limpias de uso alimentario, bien cerradas, y **renuévala cada 6 meses**.\n- Calcula además agua para cocinar y para higiene: la app suma 1 L/persona/día extra por defecto.\n- En un corte de suministro, llena bañera y cubos **solo para WC y limpieza**, nunca para beber.'},
    {id:id(),title:'3. Cocina con poco gas y con seguridad',color:'Verde',body:

var state;
var embedded = null;
try { embedded = JSON.parse(document.getElementById('app-state').textContent); } catch(e) { embedded = null; }
state = normalize(embedded);
var LS_KEY = 'plan-emergencia-familiar-v2';
var mode = 'init';           // init | login | loading | cloud | local | denied
var CFG = window.FIREBASE_CONFIG || null, PLAN_ID = window.PLAN_ID || 'familia';
var OFFLINE_COPY = !!window.PLAN_OFFLINE;
var downloadsApi = null, isHosted = false;

var view = { tab: 'resumen', foodQ:'', foodCat:'all', foodAlerts:false, toolCat:'all', bagCat:'all', print:{resumen:true,despensa:true,compra:true,utensilios:true,mochila:true,plan:true,guias:true,diario:true,salidas:true,blanco:true} };

function normalize(s){
  var d = defaults();
  if (!s || typeof s !== 'object') return d;
  var out = {};
  out.version = 2;
  out.savedAt = s.savedAt || 0;
  out.config = Object.assign({}, d.config, s.config || {});
  ['food','tools','bag','contacts','guides','log'].forEach(function(k){ out[k] = Array.isArray(s[k]) ? s[k] : d[k]; });
  out.plan = Object.assign({}, d.plan, s.plan || {});
  // compatibilidad con el formato antiguo (foodData/utensilsData)
  if (Array.isArray(s.foodData)) out.food = s.foodData.map(function(f){ var q = parseFloat(f.stock)||0, r = parseFloat(f.rec)||0; return {id:'i'+f.id,cat:f.category||'Otros',name:f.name||'',unit:String(f.stock||'').replace(/[\d.,\s]+/,'').trim()||'uds',qty:q,rec:r,kcal:0,exp:f.expDate||'',loc:'',notes:''}; });
  if (Array.isArray(s.utensilsData)) out.tools = s.utensilsData.map(function(u){ return {id:'u'+u.id,name:u.name,cat:u.cat,prio:u.priority||'Alta',have:!!u.status,tip:u.tip||''}; });
  return out;
}

function loadLocal(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && (s.savedAt||0) > (state.savedAt||0)) state = normalize(s);
  } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }

function commit(msg){
  state.savedAt = Date.now();
  if (mode === 'local') saveLocal();
  if (mode === 'cloud' && fb){
    dirty = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 800);
  }
  render();
  if (msg) toast(msg);
}

function pushRemote(){
  pushTimer = null;
  if (!fb || !fb.user) return;
  fb.F.setDoc(fb.ref, { data: JSON.stringify(state), savedAt: state.savedAt, by: fb.user.email || '' })
   .then(function(){ dirty = false; setBadge(); })
   .catch(function(e){
     if (e && e.code === 'permission-denied'){ mode = 'denied'; render(); }
     else toast('No se pudo guardar: ' + (e && e.code || 'error'));
   });
  setBadge();
}

/* ================= UTILIDADES ================= */
function isoDate(d){ var m = d.getMonth()+1, dd = d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function pDate(s){ if (!s) return null; var p = String(s).split('-'); if (p.length<3) return null; var d = new Date(+p[0], +p[1]-1, +p[2]); return isNaN(d) ? null : d; }
function daysUntil(s){ var d = pDate(s); if (!d) return null; var t = pDate(TODAY_ISO); return Math.round((d - t)/86400000); }
function fDate(s){ var d = pDate(s); if (!d) return '—'; return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmt(x, dec){ if (x === null || x === undefined || isNaN(x)) return '—'; return Number(x).toLocaleString('es-ES',{maximumFractionDigits: dec===undefined?1:dec}); }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var x = parseFloat(String(v).replace(',','.')); return isNaN(x)?0:x; }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
function meter(p){ var c = p>=100?'':(p>=60?'w':'b'); return '<div class="meter"><i class="'+c+'" style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>'; }
function find(col,id){ return state[col].filter(function(x){return x.id===id;})[0]; }
function colorOf(name){ return GUIDE_COLORS[name] || name || '#475569'; }

function mdLite(text){
  var lines = String(text||'').split(/\r?\n/), html = '', inList = false;
  function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
  lines.forEach(function(l){
    var t = l.trim();
    if (/^[-•*]\s+/.test(t)){ if(!inList){html+='<ul>';inList=true;} html += '<li>'+inl(t.replace(/^[-•*]\s+/,''))+'</li>'; return; }
    if (inList){ html+='</ul>'; inList=false; }
    if (/^#{1,3}\s+/.test(t)) html += '<h5>'+inl(t.replace(/^#{1,3}\s+/,''))+'</h5>';
    else if (t) html += '<p>'+inl(t)+'</p>';
  });
  if (inList) html += '</ul>';
  return html;
}

/* ================= CÁLCULOS ================= */
function calc(){
  var c = state.config, people = Math.max(1,num(c.people)), days = Math.max(1,num(c.days));
  var factor = (people*days)/(Math.max(1,num(c.basePeople))*Math.max(1,num(c.baseDays)));
  var dailyWater = people*(num(c.waterDrink)+num(c.waterExtra));
  var waterNeed = dailyWater*days, drinkNeed = people*num(c.waterDrink)*days;
  var waterStock = 0, kcalStock = 0, expired = [], rotate = [], shopping = [];
  state.food.forEach(function(f){
    var du = daysUntil(f.exp), isExp = du !== null && du < 0;
    if (isExp) expired.push(f); else if (du !== null && du <= num(c.warnDays)) rotate.push(f);
    if (!isExp){
      if (f.cat === 'Agua') waterStock += num(f.qty);
      kcalStock += num(f.qty)*num(f.kcal);
    }
    var r = recOf(f, factor);
    if (r > 0 && num(f.qty) < r) shopping.push({name:f.name, cat:f.cat, need: r-num(f.qty), unit:f.unit, kind:'food'});
  });
  var kcalNeed = people*num(c.kcal)*days;
  var waterDays = dailyWater>0 ? waterStock/dailyWater : 0;
  var foodDays = num(c.kcal)>0 ? kcalStock/(people*num(c.kcal)) : 0;
  var gasNeed = num(c.gasMinCan)>0 ? Math.ceil(days*num(c.gasMinDay)/num(c.gasMinCan)) : 0;
  var gasDays = num(c.gasMinDay)>0 ? num(c.gasStock)*num(c.gasMinCan)/num(c.gasMinDay) : 0;
  if (num(c.gasStock) < gasNeed) shopping.push({name:'Cartuchos de gas 230 g', cat:'Combustible', need: gasNeed-num(c.gasStock), unit:'cartuchos', kind:'food'});
  var toolsReady = state.tools.filter(function(t){return t.have;}).length;
  var critMissing = state.tools.filter(function(t){return !t.have && t.prio==='Crítica';});
  state.tools.forEach(function(t){ if(!t.have) shopping.push({name:t.name, cat:t.cat, need:null, unit:'', kind:'tool', prio:t.prio}); });
  var bagReady = state.bag.filter(function(b){return b.have;}).length;
  var revDays = state.config.lastReview ? -daysUntil(state.config.lastReview) : null;
  return {people:people, days:days, factor:factor, dailyWater:dailyWater, waterNeed:waterNeed, drinkNeed:drinkNeed, waterStock:waterStock, kcalNeed:kcalNeed, kcalStock:kcalStock,
    waterDays:waterDays, foodDays:foodDays, autonomy: Math.min(waterDays, foodDays), gasNeed:gasNeed, gasDays:gasDays,
    expired:expired, rotate:rotate, shopping:shopping, toolsReady:toolsReady, critMissing:critMissing, bagReady:bagReady, revDays:revDays};
}
function recOf(f, factor){ var r = num(f.rec)*factor; return Math.round(r*10)/10; }
function statusOf(f){
  var du = daysUntil(f.exp);
  if (du === null) return {c:'n', t:'Sin fecha'};
  if (du < 0) return {c:'b', t:'¡CADUCADO!'};
  if (du <= num(state.config.warnDays)) return {c:'w', t: du < 31 ? 'Rotar ('+du+' d)' : 'Rotar ('+Math.round(du/30.44)+' m)'};
  return {c:'ok', t:'En fecha'};
}

function vResumen(k){

  h += kpi('⚠️','Caducidades', '<span style="color:var(--bad)">'+k.expired.length+'</span> · <span style="color:var(--warn)">'+k.rotate.length+'</span>', 'caducados · a rotar (≤ '+fmt(c.warnDays,0)+' días)');

  h += kpi('🎒','Mochila 72 h', k.bagReady+' / '+state.bag.length, 'elementos preparados', pct(k.bagReady,state.bag.length));
  var rv = k.revDays;
  h += kpi('📅','Última revisión', c.lastReview? fDate(c.lastReview) : 'Sin registrar', rv===null?'Revisa la reserva cada 6 meses': (rv>180?'<span style="color:var(--bad)">Hace '+rv+' días: toca revisar</span>':'Hace '+rv+' días'));
  h += '</div>';

  // alertas
  var al = [];
  k.expired.forEach(function(f){ al.push(['b','⛔ <b>'+esc(f.name)+'</b> caducó el '+fDate(f.exp)+'. Retíralo o repónlo.']); });

  if (k.kcalStock < k.kcalNeed) al.push(['w','🍞 Faltan <b>'+fmt((k.kcalNeed-k.kcalStock)/1000,1)+' mil kcal</b> para el objetivo.']);
  if (num(c.gasStock) < k.gasNeed) al.push(['w','🔥 Faltan <b>'+fmt(k.gasNeed-num(c.gasStock),0)+'</b> cartuchos de gas.']);
  if (rv === null || rv > 180) al.push(['i','📅 Registra una revisión general cuando compruebes fechas, pilas y powerbank.']);
  h += '<div class="sec"><div class="bar"><h3 style="margin:0">Avisos</h3><div class="tools"><button class="btn sm" data-act="review">✅ Marcar revisión hoy</button><button class="btn sm" data-act="tab" data-v="imprimir">🖨️ Imprimir lista de la compra</button></div></div>';

function showModal(h){ closeModal(); var d = document.createElement('div'); d.id='modal-host'; d.innerHTML = h; document.body.appendChild(d); }

function confirmBox(msg, yes){
  showModal('<div class="modal-bg" data-act="mclose-bg"><div class="modal"><h3>¿Seguro?</h3><p>'+msg+'</p><div class="foot"><button class="btn" data-act="mclose">Cancelar</button><button class="btn p" id="cyes">Sí, continuar</button></div></div></div>');

function saveEditor(form){
  var ctx = modalCtx, sc = SCHEMAS[ctx.col];
  var item = ctx.id ? find(ctx.col, ctx.id) : Object.assign({id:uid()}, sc.def());
  var fd = form.elements;
  for (var i=0;i<sc.fields.length;i++){
    var f = sc.fields[i], el = fd[f.k];
    if (f.t==='check') item[f.k] = el.checked;
    else if (f.t==='number') item[f.k] = num(el.value);
    else item[f.k] = el.value.trim();
    if (f.req && !item[f.k]){ el.focus(); return; }
  }
  if (ctx.col==='food' && item.cat==='Agua' && !item.unit) item.unit = 'L';
  if (!ctx.id) state[ctx.col].push(item);
  closeModal();
  commit(ctx.id ? 'Cambios guardados' : 'Añadido');
}

function toast(msg){

}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), col = el.getAttribute('data-col');
  if (a==='mclose-bg'){ if (e.target===el) closeModal(); return; }
  if (a==='toggle'){ var t = find(col,id); if (t){ t.have = el.checked; commit(); } return; }
  if (el.tagName==='INPUT') return;
  switch(a){
    case 'tab': view.tab = el.getAttribute('data-v'); try{ location.hash = view.tab; }catch(_){} render(); window.scrollTo(0,0); break;
    case 'edit': openEditor(col, id); break;
    case 'del': confirmBox('Se eliminará este elemento.', function(){ state[col] = state[col].filter(function(x){return x.id!==id;}); commit('Eliminado'); }); break;
    case 'mclose': closeModal(); break;
    case 'logout': if (fb){ if (fb.unsub){ fb.unsub(); fb.unsub = null; } fb.U.signOut(fb.auth); } break;
    case 'forgot': (function(){ var f = document.getElementById('loginf'); var em = f && f.email.value.trim(); if (!em){ loginErr = 'Escribe primero tu correo.'; render(); return; }
      fb.U.sendPasswordResetEmail(fb.auth, em).then(function(){ loginErr=''; loginInfo='Si el correo está dado de alta, te llegará un enlace para cambiar la contraseña.'; render(); }).catch(function(e){ loginErr = authMsg(e); render(); }); })(); break;
    case 'inc': case 'dec': var f = find('food',id); if (f){ f.qty = Math.max(0, Math.round((num(f.qty)+(a==='inc'?1:-1))*100)/100); commit(); } break;
    case 'review': state.config.lastReview = TODAY_ISO; commit('Revisión registrada hoy'); break;
    case 'bagreset': confirmBox('Se desmarcarán todos los elementos de la mochila (útil para empezar una revisión).', function(){ state.bag.forEach(function(b){b.have=false;}); commit(); }); break;
    case 'gup': var i = state.guides.findIndex(function(g){return g.id===id;}); if (i>0){ var g = state.guides.splice(i,1)[0]; state.guides.splice(i-1,0,g); commit(); } break;
    case 'printall': PRINT_SECTIONS.forEach(function(s){view.print[s[0]]=true;}); render(); break;
    case 'printnone': PRINT_SECTIONS.forEach(function(s){view.print[s[0]]=false;}); render(); break;
    case 'print': doPrint(); break;
    case 'dlapp': saveFile('plan-emergencia-offline.html', buildAppDoc()); break;
    case 'dljson': saveFile('plan-emergencia-datos-'+TODAY_ISO+'.json', JSON.stringify(state, null, 2)); break;
    case 'copyjson': try { navigator.clipboard.writeText(JSON.stringify(state)).then(function(){toast('Datos copiados al portapapeles');}, function(){toast('No se pudo copiar');}); } catch(_){ toast('No se pudo copiar'); } break;
    case 'reset': confirmBox('Se borrarán tus datos y se cargarán los de ejemplo.', function(){ var s = defaults(); state = s; commit('Datos restablecidos'); }); break;
    case 'resetguides': confirmBox('Se sustituirán las guías actuales por las guías por defecto.', function(){ state.guides = defaultGuides().map(function(g){ g.id = uid()+g.id; return g; }); commit('Guías restauradas'); }); break;
  }
});
document.addEventListener('submit', function(e){
  if (e.target.id==='mform'){ e.preventDefault(); saveEditor(e.target); }
  if (e.target.id==='loginf'){ e.preventDefault(); var f = e.target, btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Entrando…'; loginErr=''; loginInfo='';
    fb.U.signInWithEmailAndPassword(fb.auth, f.email.value.trim(), f.pass.value).catch(function(err){ loginErr = authMsg(err); render(); }); }
});
function authMsg(e){
  var c = e && e.code || '';
  if (c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email'||c==='auth/invalid-login-credentials') return 'Correo o contraseña incorrectos.';
  if (c==='auth/too-many-requests') return 'Demasiados intentos. Espera unos minutos.';
  if (c==='auth/network-request-failed') return 'Sin conexión con el servidor.';
  return 'No se pudo entrar ('+c+').';
}

document.addEventListener('change', function(e){
  var t = e.target;
  if (t.hasAttribute('data-cfg')){ var k = t.getAttribute('data-cfg'); state.config[k] = t.type==='number' ? num(t.value) : t.value; commit(); return; }
  if (t.hasAttribute('data-plan')){ state.plan[t.getAttribute('data-plan')] = t.value; commit(); return; }
  if (t.hasAttribute('data-view')){ var vk = t.getAttribute('data-view'); view[vk] = t.type==='checkbox' ? t.checked : t.value; render(); return; }
  if (t.hasAttribute('data-print')){ view.print[t.getAttribute('data-print')] = t.checked; return; }
  if (t.id==='imp' && t.files && t.files[0]){
    var r = new FileReader();
    r.onload = function(ev){
      try { var s = JSON.parse(ev.target.result); confirmBox('Se sustituirán los datos actuales por los del archivo importado.', function(){ state = normalize(s); commit('Datos importados'); }); }

function saveFile(name, data){
  if (downloadsApi){
    downloadsApi.save({filename:name, data:data}).then(function(){ toast('Archivo descargado'); }).catch(function(e){
      var c = e && e.code;
      if (c==='declined') return;
      if (c==='rate_limited') { toast('Espera un momento y vuelve a intentarlo'); return; }
      toast('No se pudo descargar en esta vista');
    });
    return;
  }
  if (isHosted){ toast('Las descargas no están disponibles en esta vista'); return; }
  try {
    var blob = new Blob([data], {type: /\.json$/.test(name)?'application/json':'text/html'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch(e){ toast('No se pudo descargar'); }
}
function doPrint(){
  var any = PRINT_SECTIONS.some(function(s){return view.print[s[0]];});
  if (!any){ toast('Marca al menos una hoja'); return; }
  var doc = buildPrintDoc(true);
  if (isHosted){ saveFile('plan-emergencia-hojas-'+TODAY_ISO+'.html', doc); return; }
  var ifr = document.createElement('iframe');
  ifr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';

  ifr.onload = function(){ try { ifr.contentWindow.focus(); ifr.contentWindow.print(); } catch(e){ toast('No se pudo abrir la impresión'); } setTimeout(function(){ ifr.remove(); }, 60000); };
  ifr.srcdoc = buildPrintDoc(false);
}

      s6 += '<tr><td>'+esc(b.name)+(b.notes?' <span class="note">· '+esc(b.notes)+'</span>':'')+'</td><td>'+esc(b.cat)+'</td>'+cells+'</tr>'; });
    var bc=''; for (var j=0;j<np;j++) bc += '<td></td>';
    for (var r=0;r<3;r++) s6 += '<tr class="blank"><td></td><td></td>'+bc+'</tr>';
    s6 += '</table><p class="note">Fecha de la última revisión de las mochilas: ____ / ____ / ________</p>';
    sec('Checklist de la mochila de evacuación (72 h)', s6);
  }
  if (P.guias){
    var s7 = '<div class="sos">EMERGENCIAS: 112 · Sigue siempre las indicaciones de las autoridades</div><div class="cols">';
    state.guides.forEach(function(g){ s7 += '<div class="g"><h4>'+esc(g.title)+'</h4>'+mdLite(g.body)+'</div>'; });
    s7 += '</div>';
    sec('Guías y protocolos', s7);
  }
  if (P.diario){
    var s8 = '<p class="note">Objetivo diario: '+fmt(k.dailyWater,1)+' L de agua · '+fmt(k.people*num(c.kcal),0)+' kcal · '+fmt(c.gasMinDay,0)+' min de gas. Empieza con '+fmt(k.waterStock,0)+' L de agua.</p><table><tr><th style="width:9mm">Día</th><th style="width:18mm">Fecha</th><th style="width:17mm">Agua usada (L)</th><th style="width:17mm">Agua queda (L)</th><th>Desayuno</th><th>Comida</th><th>Cena</th><th style="width:14mm">Gas (min)</th><th>Salud / incidencias</th></tr>';
    for (var d=1; d<=Math.min(60,Math.round(k.days)); d++) s8 += '<tr class="blank"><td class="c">'+d+'</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
    s8 += '</table>';
    sec('Hoja de control diario', s8);
  }
  if (P.salidas){
    var s9 = '<p class="note">Anota cada producto que sale de la reserva. Así sabrás qué queda sin recontar todo.</p><table><tr><th style="width:20mm">Fecha</th><th>Producto</th><th style="width:22mm">Cantidad</th><th style="width:22mm">Quedan</th><th style="width:28mm">Quién</th></tr>' + blanks(5,32) + '</table>';
    sec('Registro de salidas de la despensa', s9);
  }
  if (P.blanco){
    var s10 = '<table><tr><th>Producto</th><th style="width:16mm">Ud.</th><th style="width:16mm">Cantidad</th><th style="width:22mm">Caducidad</th><th style="width:22mm">Ubicación</th><th style="width:30mm">Notas</th></tr>' + blanks(6,32) + '</table>';
    sec('Inventario en blanco', s10);
  }
  var bar = autoPrint ? '' : '';
  var head = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plan de Emergencia · hojas para imprimir</title><style>'+PRINT_CSS+'</style></head><body>';
  if (autoPrint) head += '<div class="bar">Hojas del Plan de Emergencia <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button></div>';
  var tail = autoPrint ? '<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});</scr'+'ipt>' : '';
  return head + out.join('') + tail + '</body></html>';
}

/* ================= ARRANQUE ================= */
var h0 = (location.hash||'').slice(1);
if (TABS.some(function(t){return t[0]===h0;})) view.tab = h0;
window.addEventListener('online', setBadge); window.addEventListener('offline', setBadge);

function startLocal(msg){ mode = 'local'; loadLocal(); render(); if (msg) toast(msg); }

if (OFFLINE_COPY || !CFG || !CFG.apiKey){ startLocal(); }
else {
  render();
  var V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  Promise.all([import(V+'firebase-app.js'), import(V+'firebase-auth.js'), import(V+'firebase-firestore.js')]).then(function(m){
    var A = m[0], U = m[1], F = m[2];
    var app = A.initializeApp(CFG), auth = U.getAuth(app), db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentSingleTabManager({ forceOwnership: true }) }) }); }
    catch(e){ db = F.getFirestore(app); }
    fb = { A:A, U:U, F:F, auth:auth, db:db, ref: F.doc(db, 'planes', PLAN_ID), user:null, unsub:null };
    U.onAuthStateChanged(auth, function(user){
      fb.user = user;
      if (fb.unsub){ fb.unsub(); fb.unsub = null; }
      if (!user){ state = normalize(null); mode = 'login'; render(); return; }
      mode = 'loading'; render();
      var first = true;
      fb.unsub = F.onSnapshot(fb.ref, { includeMetadataChanges: true }, function(snap){
        fromCache = snap.metadata.fromCache;
        if (snap.exists()){
          var s2 = null;
          try { s2 = JSON.parse(snap.data().data); } catch(e){}
          if (s2 && (first || (!pushTimer && (s2.savedAt||0) > (state.savedAt||0)))){ state = normalize(s2); mode = 'cloud'; render(); }
          else if (mode !== 'cloud'){ mode = 'cloud'; render(); }
          else setBadge();
          first = false;
        } else if (!snap.metadata.fromCache){
          // primera vez: se crea el plan en la nube con los datos de ejemplo
          first = false; mode = 'cloud'; state = normalize(null); commit('Plan creado en la nube');
        }
      }, function(err){
        if (err && err.code === 'permission-denied'){ mode = 'denied'; render(); }
        else toast('Error de sincronización: ' + (err && err.code));
      });
    });
  }).catch(function(){ startLocal('No se pudo cargar Firebase (¿sin conexión?). Modo local.'); });
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !OFFLINE_COPY){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
